name: rvc_mobile_application
description: "A project for RVC app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  # ── Flutter SDK & i18n cơ bản ────────────────────────────────────────────────
  flutter: # Core Flutter SDK
    sdk: flutter
  flutter_localizations: # Hỗ trợ đa ngôn ngữ qua intl & ARB
    sdk: flutter

  # ── State management, DI & utilities ─────────────────────────────────────────
  bloc: 9.0.0 # Core BLoC pattern (business logic)
  flutter_bloc: 9.1.1 # Widgets tích hợp BLoC cho UI
  rxdart: ^0.28.0 # Stream operators (map/merge/debounce…) cho Dart
  get_it: ^8.2.0 # Service locator (DI container nhẹ)
  injectable: ^2.5.0 # Annotation-based DI (dùng với injectable_generator)
  equatable: ^2.0.7 # So sánh value-based cho state/model
  result_dart: ^1.1.1 # Kiểu Result (Success/Failure) kiểu functional

  # ── Logging & diagnostics ────────────────────────────────────────────────────
  talker_flutter: ^4.9.3 # UI logger/error viewer trong app
  talker_dio_logger: ^4.9.3 # Interceptor log request/response cho Dio
  talker_bloc_logger: ^4.9.3 # Logger cho sự kiện/trạng thái BLoC

  # ── Data models & annotations ────────────────────────────────────────────────
  freezed_annotation: ^3.1.0 # Annotations cho freezed (immutable/union)
  json_annotation: 4.9.0 # Annotations cho json_serializable

  # ── Networking, API & connectivity ──────────────────────────────────────────
  dio: ^5.8.0+1 # HTTP client mạnh, interceptor, cancel, file, v.v.
  retrofit: ^4.4.2 # Interface-based REST client (codegen) dùng với Dio
  connectivity_plus: ^6.1.3 # Theo dõi trạng thái kết nối mạng
  http: ^1.5.0 # HTTP client đơn giản (có thể bỏ nếu chỉ dùng Dio)

  # ── Routing & navigation ────────────────────────────────────────────────────
  auto_route: ^10.1.1 # Router codegen (type-safe, guards, nested…)

  # ── Storage, file system & device info ──────────────────────────────────────
  flutter_secure_storage: ^9.2.4 # Lưu trữ khóa/secret an toàn (Keychain/Keystore)
  rx_shared_preferences: 4.0.0 # Wrapper reactive cho shared_preferences
  path_provider: ^2.1.5 # Lấy path thư mục hệ thống (documents/temp…)
  path: ^1.9.1 # Xử lý path (join, dirname…) thuần Dart
  device_info_plus: ^11.3.0 # Thông tin thiết bị (model, OS, SDK…)
  uuid: ^4.5.1 # Sinh UUID (v1/v4/v5) cho id tạm
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.3

  # ── Firebase stack ──────────────────────────────────────────────────────────
  firebase_core: ^4.0.0 # Khởi tạo Firebase
  firebase_messaging: ^16.0.0 # FCM push notifications
  firebase_analytics: ^12.0.0 # Analytics sự kiện, màn hình

  # ── Notifications ───────────────────────────────────────────────────────────
  flutter_local_notifications: ^19.4.0 # Thông báo cục bộ (schedule, actions…)

  # ── UI, UX & layout widgets ─────────────────────────────────────────────────
  flutter_screenutil: 5.9.3 # Responsive size/dp theo màn hình
  cached_network_image: ^3.4.1 # Ảnh mạng có cache + placeholder/error
  flutter_svg: ^2.0.10+1 # Render SVG vector
  lottie: ^3.2.0 # Animation Lottie JSON
  shimmer: ^3.0.0 # Hiệu ứng skeleton shimmering
  carousel_slider: ^5.0.0 # Slider/carousel item
  visibility_detector: 0.4.0+2 # Phát hiện widget vào/ra viewport
  keyboard_avoider: 0.2.0 # Tránh bàn phím che nội dung đơn giản
  flutter_keyboard_visibility: ^6.0.0 # Lắng nghe trạng thái bàn phím (show/hide)
  flutter_smart_dialog: ^4.9.8+9 # HUD/dialog/toast linh hoạt, queue
  gradient_borders: ^1.0.0
  country_flags: ^4.0.1

  # ── UX feedback / communication ─────────────────────────────────────────────
  rate_my_app: ^2.3.1 # Nhắc người dùng đánh giá app (in-app review)
  timeago: ^3.7.0 # Định dạng thời gian tương đối (e.g. "5 phút trước")

  # ── App config & tiện ích chung ─────────────────────────────────────────────
  flutter_native_splash: ^2.4.4 # Tạo splash màn hình native
  flutter_dotenv: ^5.2.1 # Đọc biến môi trường từ file .env
  url_launcher: ^6.3.1 # Mở URL, gọi điện, email, map…
  intl: 0.20.2 # Định dạng số/ngày/chuỗi đa ngôn ngữ
  dart_jsonwebtoken: ^3.2.0 # JWT encode/decode/verify
  permission_handler: ^12.0.0+1 # Xin/cấp quyền hệ thống (camera, storage…)
  rename_app: ^1.6.5 # Đổi tên app (rename_app)
  auto_size_text: ^3.0.0
  mobile_device_identifier: ^0.0.3

  image_picker: 1.1.2 # Chọn ảnh từ thiết bị
  image_cropper: ^8.0.2 # Cắt ảnh
  animated_bottom_navigation_bar: ^1.4.0
  firebase_auth: ^6.1.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+6
  in_app_purchase_storekit: ^0.4.6
  pin_code_fields: ^8.0.1
  photo_manager: ^3.7.1
  photo_view: ^0.15.0
  widget_zoom: ^0.0.4
  speech_to_text: ^7.3.0
  avatar_glow: ^3.0.1
  camera: ^0.11.3
  flutter_animate: ^4.5.2
  just_audio: ^0.10.5
  record: ^6.1.2

dev_dependencies:
  # ── Test & lint ─────────────────────────────────────────────────────────────
  flutter_test: # Bộ test chính thức của Flutter
    sdk: flutter
  flutter_lints: ^6.0.0 # Bộ quy tắc lint mặc định recommended

  # ── Code generation (build_runner) ──────────────────────────────────────────
  build_runner: ^2.7.0 # Chạy codegen cho freezed/json/retrofit/auto_route…
  freezed: ^3.2.0 # Codegen cho freezed (data class/union/copyWith…)
  json_serializable: ^6.9.0 # Codegen (toJson/fromJson) dùng với json_annotation
  retrofit_generator: ^10.0.2 # Tạo client Retrofit từ interface
  auto_route_generator: ^10.2.4 # Sinh route/navigation dựa trên annotations
  injectable_generator: ^2.6.2 # Sinh mã DI cho injectable/get_it
  flutter_gen_runner: ^5.10.0 # Sinh Assets/Fonts/Colors type-safe (flutter_gen)
  intl_utils: ^2.8.8 # Sinh localization từ ARB (flutter_intl)
  launcher_name: ^1.0.2 # Tạo tên app & icon launcher (launcher_name)
  melos: any # Quản lý mono-repo (nếu cần)
  flutter_launcher_icons: ^0.14.4 # Tạo icon launcher (flutter_launcher_icons)
  change_app_package_name: ^1.4.0 # Đổi tên app (change_app_package_name)

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - .env
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Italic.ttf
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto/Roboto-MediumItalic.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto/Roboto-BoldItalic.ttf

flutter_gen:
  output: lib/common/generated/
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
      style: dot-delimiter
  fonts:
    enabled: true
  colors:
    enabled: true
    inputs:
      - assets/color/colors.xml

flutter_intl:
  enabled: true
  main_locale: "en"
  arb_dir: assets/l10n
  output_dir: lib/core/language/generated

melos:
  packages:
    - . # chạy trong chính project hiện tại
  scripts:
    assets:generate:
      description: Generate package name, app name
      run: >
        echo STEP 1: package name &&
        dart run change_app_package_name:main com.fau.skinsoft &&
        echo STEP 2: app name &&
        dart run rename_app:main all="SkinSort"
