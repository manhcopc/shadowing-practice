flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  image_path: "assets/images/logo_app.png"

  min_sdk_android: 21
  # Adaptive icon (Android 8+)
  adaptive_icon_foreground: assets/images/logo_app.png
  adaptive_icon_background: "#ffffff"
  #   1 − 0.667 ≈ 0.333 → chia đôi hai viền ≈ 16‑17 %
  adaptive_icon_foreground_inset: 16 # (%) an toàn, logo sẽ ≈ 967 px

